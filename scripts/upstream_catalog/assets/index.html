<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS Bot · 上游更新台账</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><p class="eyebrow">DS BOT / UPSTREAM</p><h1>上游更新台账</h1><p id="context">正在读取本地台账…</p></div><div class="header-actions"><span id="pending"></span><button id="export" disabled>更新同步记录</button></div></header>
<main><section aria-label="筛选PR" class="filters"><label class="search">搜索 PR / 功能 / 文件<input id="q" type="search" placeholder="例如：并行会话、2130、settings" autocomplete="off"></label><label>采用结果<select id="status"><option value="">全部状态</option><option>采用</option><option>需讨论</option><option>暂缓</option><option>跳过</option></select></label><label>我的选择<select id="wanted"><option value="">全部选择</option><option value="unset">待评估</option><option value="1">需要</option><option value="0">不需要</option></select></label><label>依赖组<select id="group"><option value="">全部依赖组</option></select></label><label>类型<select id="category"><option value="">全部类型</option><option value="feature">功能</option><option value="fix">修复</option><option value="maintenance">维护</option></select></label><label>最低权重<input id="min" type="number" min="1" max="10" value="1"></label><label>最高权重<input id="max" type="number" min="1" max="10" value="10"></label><label>排序<select id="sort"><option value="status">状态 → 权重</option><option value="time">最近变更</option></select></label><label class="check"><input id="stale" type="checkbox">只看需重审</label><button id="clear" class="secondary">清空筛选</button></section>
<div id="notice" role="status" aria-live="polite"></div><div class="result-line"><p id="summary">正在加载…</p><p id="counts"></p></div>
<div class="workspace"><section class="list" aria-label="PR列表"><div class="table-wrap"><table><thead><tr><th>PR</th><th>功能作用</th><th>采用结果</th><th>我的选择</th><th>权重</th><th>依赖组</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>没有符合条件的 PR。可以减少筛选条件，或点击“清空筛选”。</p><nav class="pagination" aria-label="分页"><button id="prev" class="secondary">上一页</button><span id="range"></span><button id="next" class="secondary">下一页</button></nav></section>
<aside id="detail" aria-label="PR详情"><p class="detail-empty">选择一项 PR，查看它解决什么问题、本地差异和完整处理方案。</p></aside></div>
<details class="storage"><summary>来源、存储与使用边界</summary><p id="storage"></p><p>页面标记只更新台账；不会合并代码、删除已装功能或重启 DSH。采用结果和“我的选择”独立保存。点击“更新同步记录”写入本同步分支的 upstream-changelog.md，不自动提交或推送。</p></details></main></body></html>
